name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run tests
        run: npm test

      - name: Build
        run: |
          npm run build
          for zip in build/OldTweetDeckChrome.zip build/OldTweetDeckFirefox.zip; do
            if unzip -l "$zip" | grep -E ' (test|node_modules)/| playwright\.config\.js'; then
              echo "$zip contains files that are not part of the extension"
              exit 1
            fi
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
