name: Pack Extension

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ "published" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4

      - name: Install ZIP
        uses: montudor/action-zip@v1
        
      - name: Setup NPM packages
        run: npm install

      - name: Pack extension
        run: npm run build

      - name: Unzip extension
        run: unzip -qq ./build/TweeXDeckChrome.zip -d build/TweeXDeckChrome; unzip -qq ./build/TweeXDeckFirefox.zip -d build/TweeXDeckFirefox
        working-directory: ${{ github.workspace }}
        
      - name: Upload for Firefox
        uses: actions/upload-artifact@v4
        with:
          name: TweeXDeckFirefox
          path: ${{ github.workspace }}/build/TweeXDeckFirefox
      - name: Upload for Chromium
        uses: actions/upload-artifact@v4
        with:
          name: TweeXDeckChrome
          path: ${{ github.workspace }}/build/TweeXDeckChrome

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/TweeXDeckChrome.zip build/TweeXDeckFirefox.zip --clobber --repo "$GITHUB_REPOSITORY"
